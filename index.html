<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f64b82"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="体重管理"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>体重管理</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#3f3b42;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:radial-gradient(circle at 15% 18%,rgba(255,255,255,.95) 0 2px,transparent 3px),linear-gradient(135deg,#fff8fb,#fff0f6 48%,#ffe5ef);overflow-x:hidden}body:before,body:after{content:"♡";position:fixed;z-index:-1;color:#f5a4bc;opacity:.58;line-height:1}body:before{font-size:82px;left:8vw;bottom:12vh;transform:rotate(-8deg)}body:after{font-size:66px;right:9vw;top:16vh;transform:rotate(10deg)}.deco{position:fixed;z-index:-1;color:#efb0c4;opacity:.7;font-weight:700;pointer-events:none}.d1{font-size:46px;left:11vw;top:18vh}.d2{font-size:48px;right:12vw;top:30vh}.d3{font-size:34px;left:18vw;bottom:8vh}.d4{font-size:38px;right:18vw;bottom:14vh}main{max-width:740px;margin:auto;padding:28px 22px 54px}header{text-align:center}h1{margin:0 0 14px;color:#e95b8a;font-size:clamp(30px,6vw,42px);letter-spacing:.08em}.intro{margin:0 0 30px;font-size:18px}.card,.summary,.chart-box{padding:28px;margin-top:28px;background:rgba(255,255,255,.88);border-radius:22px;box-shadow:0 12px 32px rgba(199,75,120,.12);backdrop-filter:blur(3px)}.summary,.chart-box{border:1.5px solid #ffc2d6;background:rgba(255,245,249,.82)}label{display:block;margin:22px 0 9px;color:#e95b8a;font-size:19px;font-weight:800}input,textarea{width:100%;min-height:64px;padding:12px 20px;border:1.5px solid #ff9abb;border-radius:13px;font-size:20px;background:rgba(255,255,255,.86)}textarea{min-height:110px;resize:vertical;font-family:inherit;}.unit{position:relative}.unit span{position:absolute;right:20px;top:20px;color:#857a80}button{width:100%;min-height:64px;margin-top:32px;border:0;border-radius:13px;background:linear-gradient(110deg,#f6467e,#ff5f98);color:#fff;font-size:21px;font-weight:800;box-shadow:0 9px 20px rgba(246,70,126,.22);cursor:pointer}button:active{transform:translateY(1px)}#message{min-height:24px;margin:14px 2px 0;color:#e34177;font-weight:700}#message.error{color:#b42318}.summary h2,.chart-box h2{margin:0 0 17px;color:#e95b8a;font-size:20px}#difference{padding-top:18px;border-top:1px dashed #ff9fbe;color:#e95b8a;font-size:25px;font-weight:800}.chart-box{text-align:center}.chart-wrap{position:relative;width:100%;height:320px}#chart-message{color:#857a80;padding:30px 10px}@media(max-width:600px){main{padding:24px 16px 42px}.card,.summary{padding:20px 18px}.chart-box{padding:20px 10px}.chart-wrap{height:280px}body:before{font-size:60px}.d1{left:4vw}.d2{right:4vw}}
</style></head><body><span class="deco d1">✦</span><span class="deco d2">✧</span><span class="deco d3">♡</span><span class="deco d4">✦</span><main><header><h1>♥ 体重管理 ♥</h1><p class="intro">今日の記録を入力しましょう。</p></header><section class="card"><label>日付</label><input id="record-date" type="date"><label>体重</label><div class="unit"><input id="weight" type="number" inputmode="decimal" min="0" step="0.1" placeholder="例：55.2"><span>kg</span></div><label>目標体重</label><div class="unit"><input id="goal-weight" type="number" inputmode="decimal" min="0" step="0.1" placeholder="例：50.0"><span>kg</span></div><button id="save-button">記録する</button>
<label>今日のメモ</label>
<textarea id="memo" rows="4" placeholder="食べたもの・気分・ひとこと日記など"></textarea>
<p id="message"></p></section><section class="summary"><h2>選んだ日の記録</h2><p id="record-status">体重を記録すると、ここに表示されます。</p><p id="difference"></p></section><section class="chart-box"><h2>体重の推移 📈</h2><div class="chart-wrap"><canvas id="weight-chart"></canvas><p id="chart-message">体重を記録すると、ここにグラフが表示されます。</p></div></section></main><script>
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));const $=s=>document.querySelector(s),dateInput=$("#record-date"),weightInput=$("#weight"),goalWeightInput=$("#goal-weight"),memoInput=$("#memo"),saveButton=$("#save-button"),message=$("#message"),chartMessage=$("#chart-message"),chartCanvas=$("#weight-chart");dateInput.value=new Date().toISOString().slice(0,10);if(localStorage.goalWeight)goalWeightInput.value=localStorage.goalWeight;function prev(d){let x=new Date(d+"T12:00:00");x.setDate(x.getDate()-1);return x.toISOString().slice(0,10)}function summary(){let r=JSON.parse(localStorage.weightRecords||"[]"),c=r.find(x=>x.date===dateInput.value);if(!c){$("#record-status").textContent="この日の体重は、まだ記録されていません。";$("#difference").textContent="";memoInput.value="";return}$("#record-status").textContent=`${c.date} の体重：${c.weight.toFixed(1)} kg`;memoInput.value=c.memo||"";let p=r.find(x=>x.date===prev(c.date));$("#difference").textContent=!p?"前日の記録はありません。":`前日との差：${(c.weight-p.weight)>=0?"+":""}${(c.weight-p.weight).toFixed(1)} kg`}let chart;function draw(){let r=JSON.parse(localStorage.weightRecords||"[]").sort((a,b)=>a.date.localeCompare(b.date)),g=Number(localStorage.goalWeight);if(!r.length){chartCanvas.style.display="none";chartMessage.style.display="block";return}chartCanvas.style.display="block";chartMessage.style.display="none";if(chart)chart.destroy();chart=new Chart(chartCanvas,{type:"line",data:{labels:r.map(x=>x.date.slice(5).replace("-","/")),datasets:[{label:"体重",data:r.map(x=>x.weight),borderColor:"#f64b82",backgroundColor:"rgba(246,75,130,.15)",borderWidth:3,pointRadius:5,tension:.3,fill:true},{label:"目標体重",data:r.map(()=>g),borderColor:"#8c7ae6",borderWidth:2,borderDash:[8,6],pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top"},tooltip:{callbacks:{label:c=>`${c.dataset.label}：${c.parsed.y.toFixed(1)} kg`}}},scales:{y:{ticks:{callback:v=>v+" kg"}}}}})}dateInput.addEventListener("change",summary);saveButton.addEventListener("click",()=>{let date=dateInput.value,w=Number(weightInput.value),g=Number(goalWeightInput.value);if(!date||!w||!g){message.textContent="日付・体重・目標体重をすべて入力してください。";message.className="error";return}let r=JSON.parse(localStorage.weightRecords||"[]"),i=r.findIndex(x=>x.date===date),rec={date,weight:w,memo:memoInput.value.trim()};if(i>=0)r[i]=rec;else r.push(rec);localStorage.weightRecords=JSON.stringify(r);localStorage.goalWeight=g;message.textContent="記録を保存しました！";message.className="";summary();draw()});summary();draw();
</script></body></html>
